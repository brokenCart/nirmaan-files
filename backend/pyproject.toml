[project]
name = "nirmaan-files-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "google-auth>=2.57.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--reuse-db"
testpaths = ["apps"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]
ignore = [
    "B008",  # DRF and Django idiomatically call functions in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # settings modules re-export by design
